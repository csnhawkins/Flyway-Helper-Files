# ===========================
# Pipeline: Flyway-AI-MigrationGeneration-Pipeline-Windows
# Version: 2.0
# Author: Redgate Software Ltd
# Last Updated: 2026-08-25
#
# Uses an AI coding agent (Claude Code by default - any MCP-compatible tool works) to drive the
# Flyway MCP server: capture schema changes, generate a migration script, and code-review it.
# A human approves before anything lands in the development branch - the agent never commits,
# branches, or opens a PR itself (see "Known limitations" at the bottom for what's still V1).
#
# TWO-PHASE DESIGN (v2): earlier versions asked the same agent session that did the work to
# also self-report a strict JSON result at the end. That kept breaking in different ways (asking
# a question instead of finishing, narrating prose instead of JSON, drifting field names) because
# "finish the task" and "report on it in an exact format" turned out to be competing goals for the
# model under pressure. This version splits them:
#   1. The agent just runs the Flyway MCP workflow to completion. Its own final words don't matter -
#      the full transcript, including every tool call and its actual return value, is captured.
#   2. A deterministic PowerShell step reads that transcript back and extracts the real facts
#      (what changed, what the code review actually found, whether a migration file exists) -
#      straight from the Flyway MCP tools' own structured output, not the model's paraphrase of it.
#   3. A second, separate AI call - with zero tools, given only those facts - adds a short
#      professional viability/deployment-risk opinion on top. This call has nothing to fail at
#      other than writing a paragraph, so it's far more reliable than the first version's approach.
# The PR raised at the end clearly separates the two: the AI's judgment call, and the hard facts
# underneath it that a reviewer can verify independently of whether they trust that judgment.
# ===========================

name: Flyway-AI-MigrationGeneration-Pipeline-Windows

# This pipeline is about capturing changes already sitting in the development database, not
# reacting to a code push - so it's triggered on demand or on a schedule, not on a branch push.
# Uncomment the schedule below once you're happy running this unattended.
trigger: none
pr: none

# schedules:
#   - cron: "0 7,13 * * 1-5" # 7am and 1pm, Mon-Fri
#     displayName: "Twice-daily AI migration check"
#     branches:
#       include:
#         - development
#     always: false # Only runs if there have been repository changes

pool:
  name: "$(AGENT_POOL)" # Self-hosted agent required - this is where Flyway CLI + your AI CLI tool must already be installed and licensed/authenticated

variables:

  ### Create a variable group (matching the name below, or your own) containing: ###
  # AGENT_POOL - self-hosted agent pool to run this pipeline on
  # FLYWAY_EMAIL / FLYWAY_TOKEN - only needed if Flyway isn't already authenticated on the agent
  # FLYWAY_AUTH_DISABLED - set true to skip Flyway auth (agent is pre-authenticated)
  #
  # NOTE: once a variable group is involved, this block must use LIST syntax throughout (as
  # below) - mixing it with the simpler "KEY: value" shorthand causes the group to silently not
  # link at all.
  - group: "ChinookGlobal"

  - name: WORKING_DIRECTORY
    value: "$(System.DefaultWorkingDirectory)"
  - name: system.debug
    value: 'false'

  # --- Project + branching ---
  - name: PROJECT_FOLDER
    value: "$(WORKING_DIRECTORY)" # Folder containing flyway.toml and .mcp.json
  - name: DEVELOPMENT_BRANCH
    value: "development" # The branch this pipeline reads from and opens its PR against
  - name: FEATURE_BRANCH_PREFIX
    value: "ai-migration"

  # --- AI agent configuration ---
  # Swap AI_CLI_COMMAND for whatever your business standardizes on - the MCP server and the
  # prompt below are tool-agnostic; only the invocation syntax changes (e.g. Copilot CLI, Cursor CLI, Gemini CLI).
  - name: AI_CLI_COMMAND
    value: "claude"
  - name: AI_MAX_TURNS
    value: "20"
  - name: CLAUDE_RAW_OUTPUT_FILE
    value: "$(Agent.TempDirectory)\\claude-raw-output.json" # Just the final result envelope - used only for run stats (duration/cost/tokens), never parsed for the migration result itself
  - name: CLAUDE_TRANSCRIPT_FILE
    value: "$(Agent.TempDirectory)\\claude-transcript.jsonl" # The FULL streamed transcript (every tool call and its real return value) - this is what the facts extraction step actually reads
  - name: MIGRATION_FACTS_FILE
    value: "$(Agent.TempDirectory)\\migration-facts.txt" # Hand-off between "Extract Hard Facts" and "Assess Migration Viability" - both steps run in the same job, so a plain file is enough
  - name: PROMPTS_FOLDER
    value: "$(WORKING_DIRECTORY)\\AzureDevOps\\prompts" # Prompt text lives in its own files (see that folder) so it can be edited/reviewed without touching pipeline YAML

### End of Pipeline Variables ###

stages:
  - stage: GenerateMigration
    displayName: "AI - Generate & Review Migration"
    jobs:
      - job: RunAgent
        displayName: "Run AI agent against Flyway MCP server"
        variables: # Tip - For sensitive variables, store these in a Library Variable Group and reference the name below (Click Pipelines --> Library --> + Variable Group)
        - group: "ChinookGlobal" # Expected Variables - FLYWAY_EMAIL/FLYWAY_TOKEN/AGENT_POOL
        - group: "SqlServer_Build" # Expected Variables - TARGET_DATABASE_URL/TARGET_DATABASE_USER/TARGET_DATABASE_PASSWORD

        steps:
          - checkout: self
            persistCredentials: true # Needed later if this job also handled git - kept for the branch/PR job below

          # Step 1 - Flyway License Authentication (skip if FLYWAY_AUTH_DISABLED=true, e.g. the demo box is already authenticated)
          - script: |
              flyway auth -IAgreeToTheEula -email="$(FLYWAY_EMAIL)" -token="$(FLYWAY_TOKEN)"
            continueOnError: false
            workingDirectory: "$(PROJECT_FOLDER)"
            displayName: "Flyway Authentication"
            condition: and(succeeded(), ne(variables['FLYWAY_AUTH_DISABLED'], true))
            env:
              FLYWAY_EMAIL: $(FLYWAY_EMAIL)
              FLYWAY_TOKEN: $(FLYWAY_TOKEN)

          # Pre-Req - Ensure Claude Code is running/on the required version on this agent.
          # This machine has a known issue where Claude Code can stop between runs, so this
          # script is run every time as a safety net rather than assumed to already be fine.
          - task: PowerShell@2
            displayName: "Claude Code - Ensure Running & Correct Version"
            inputs:
              targetType: "filePath"
              filePath: "C:\\Users\\redgate\\Desktop\\StartStop\\StartClaudeCode.ps1"

          # Step 2 - Runs the AI agent headlessly against the Flyway MCP server. The prompt describes
          # the WORKFLOW rather than naming individual tool calls, so it stays resilient if Flyway's
          # MCP tool names change in future releases. --allowedTools pre-approves the Flyway tools
          # below (plus "Skill", needed for Claude to load the flyway-capture-schema and
          # flyway-generate-migration project skills - without it, Claude can decide a skill's
          # relevant but then get silently denied loading it); --disallowedTools hard-removes
          # git/bash/file-editing tools from the agent's toolset entirely - both are required
          # together (see notes at the bottom of this file). This step no longer asks the agent to
          # self-report a JSON result - see the "TWO-PHASE DESIGN" note at the top of this file for
          # why. It only has to finish the workflow; the transcript is the source of truth.
          - task: PowerShell@2
            displayName: "AI Agent - Run Flyway Workflow"
            inputs:
              targetType: "inline"
              workingDirectory: "$(PROJECT_FOLDER)"
              script: |
                # Prevents an unattended run from silently picking up a new CLI version mid-flight.
                $env:DISABLE_AUTOUPDATER = "1"

                # Prompt text lives in AzureDevOps/prompts/ (not inline here) - it's the part of this
                # pipeline most likely to need tweaking (wording, guardrail phrasing), and keeping it
                # as plain text means it can be edited/reviewed as its own diff without touching
                # pipeline YAML/PowerShell escaping.
                $promptFile = Join-Path "$(PROMPTS_FOLDER)" "generate-migration.prompt.txt"
                if (-not (Test-Path $promptFile)) {
                  Write-Host "##vso[task.logissue type=error]Prompt file not found at $promptFile - expected it alongside this pipeline under AzureDevOps/prompts/. Has the repo checkout succeeded, or was this file moved/renamed?"
                  exit 1
                }
                $prompt = Get-Content -Raw -Path $promptFile

                # Streamed (not --output-format json) so each tool call and narration line prints
                # live as Claude works - the same visibility the interactive PowerShell script gives
                # you. Tee-Object writes the FULL raw stream (every event, including each tool's
                # actual return value) to CLAUDE_TRANSCRIPT_FILE at the same time as piping it into
                # ForEach-Object for live printing - that transcript is what the next step reads to
                # build the real result, not anything parsed here.
                $finalResultLine = $null
                & $(AI_CLI_COMMAND) -p $prompt `
                  --allowedTools "Skill,mcp__flyway__load_project,mcp__flyway__create_diff_schema_model,mcp__flyway__get_diff_details,mcp__flyway__update_schema_model,mcp__flyway__create_diff_migrations,mcp__flyway__generate_migrations,mcp__flyway__review_code" `
                  --disallowedTools "Bash,Read,Write,Edit,MultiEdit,NotebookEdit,Glob,Grep,Task,WebFetch,WebSearch,AskUserQuestion" `
                  --output-format stream-json `
                  --verbose `
                  --max-turns $(AI_MAX_TURNS) |
                  Tee-Object -FilePath "$(CLAUDE_TRANSCRIPT_FILE)" |
                  ForEach-Object {
                    $line = $_
                    if ([string]::IsNullOrWhiteSpace($line)) { return }
                    try { $evt = $line | ConvertFrom-Json } catch { return }

                    switch ($evt.type) {
                      "assistant" {
                        foreach ($block in $evt.message.content) {
                          if ($block.type -eq "tool_use") {
                            $toolLabel = $block.name -replace '^mcp__flyway__', ''
                            Write-Host "  > $toolLabel..."
                          } elseif ($block.type -eq "text" -and $block.text) {
                            Write-Host "  $($block.text)"
                          }
                        }
                      }
                      "result" { $script:finalResultLine = $line }
                      default { } # system/init and tool_result events are noisy - not shown live, but still in the transcript file for the next step
                    }
                  }

                $claudeExitCode = $LASTEXITCODE
                Write-Host "Claude CLI exit code: $claudeExitCode"

                if (-not $finalResultLine) {
                  Write-Host "##vso[task.logissue type=warning]No final 'result' event was seen in the streamed output - the run likely errored or hit --max-turns before finishing. Run stats will be unavailable, but the transcript (whatever was captured before it stopped) is still there for the next step to read."
                }
                # Always write this file, even if empty - the publish step below runs unconditionally
                # (condition: always()) and would fail trying to publish a path that doesn't exist.
                $finalResultLine | Out-File -FilePath "$(CLAUDE_RAW_OUTPUT_FILE)" -Encoding utf8
                Write-Host "Run stats envelope saved to $(CLAUDE_RAW_OUTPUT_FILE)"

                if (Test-Path "$(CLAUDE_TRANSCRIPT_FILE)") {
                  $transcriptInfo = Get-Item "$(CLAUDE_TRANSCRIPT_FILE)"
                  Write-Host "Transcript written to $(CLAUDE_TRANSCRIPT_FILE) ($($transcriptInfo.Length) bytes)"
                  if ($transcriptInfo.Length -eq 0) {
                    Write-Host "##vso[task.logissue type=warning]Transcript file is empty (0 bytes) - claude produced no captured stdout. This usually means all of its output went to stderr instead, or the process was killed/timed out mid-run."
                  }
                } else {
                  Write-Host "##vso[task.logissue type=error]Transcript file was NOT created at $(CLAUDE_TRANSCRIPT_FILE) - Tee-Object itself may have failed (check the agent has write access to Agent.TempDirectory)."
                }

                if ($claudeExitCode -ne 0) {
                  Write-Host "##vso[task.logissue type=error]Claude CLI exited with code $claudeExitCode - see output above for the reason (common cause: the .mcp.json trust prompt has never been accepted on this agent for this project - see pipeline notes at the bottom of this file)."
                  exit $claudeExitCode
                }

          # Publish both logs as build artifacts immediately, regardless of what happens next.
          # Agent.TempDirectory is ephemeral and its exact cleanup timing between jobs/stages isn't
          # something to rely on for debugging - this makes them visible from the Azure DevOps run
          # summary UI itself, no RDP/file-system access to the agent required. The transcript is
          # the one that actually matters for debugging a bad result; the raw output is just stats.
          - task: PublishBuildArtifacts@1
            displayName: "Publish AI Agent Transcript (for debugging)"
            condition: always()
            inputs:
              PathtoPublish: "$(CLAUDE_TRANSCRIPT_FILE)"
              ArtifactName: "AI-Agent-Transcript-$(Build.BuildId)"

          - task: PublishBuildArtifacts@1
            displayName: "Publish AI Agent Run Stats (for debugging)"
            condition: always()
            inputs:
              PathtoPublish: "$(CLAUDE_RAW_OUTPUT_FILE)"
              ArtifactName: "AI-Agent-RunStats-$(Build.BuildId)"

          # Step 3 - Read the transcript back and extract the real facts directly from each Flyway
          # MCP tool's own return value (matched to its call via tool_use_id) - not from anything
          # Claude said about them. This is what makes the result trustworthy regardless of how the
          # model narrated the run: "status", "what changed", and "what the code review found" are
          # all read from the actual tool outputs, the same way a human would if they scrolled back
          # through the log themselves.
          - task: PowerShell@2
            displayName: "Extract Hard Facts from Transcript"
            inputs:
              targetType: "inline"
              script: |
                if (-not (Test-Path "$(CLAUDE_TRANSCRIPT_FILE)")) {
                  Write-Host "##vso[task.logissue type=error]Transcript file not found at $(CLAUDE_TRANSCRIPT_FILE) - the AI Agent step likely never ran or wrote nothing. Check that step's log directly."
                  exit 1
                }

                function Get-ToolResultText($block) {
                  if ($null -eq $block.content) { return $null }
                  if ($block.content -is [string]) { return $block.content }
                  $parts = @()
                  foreach ($c in $block.content) {
                    if ($c.text) { $parts += $c.text } elseif ($c -is [string]) { $parts += $c }
                  }
                  return ($parts -join "`n")
                }

                # Two-pass read: record every tool_use (id -> name + input), then match each
                # tool_result back to the call that produced it via tool_use_id. Flyway MCP tools
                # return their own structured JSON as the tool_result content - read directly here.
                $toolCalls = @{}   # tool_use id -> [PSCustomObject]@{ Name; Input }
                $toolResults = @{} # short tool name -> List[ [PSCustomObject]@{ Parsed; Raw; Input } ]

                Get-Content "$(CLAUDE_TRANSCRIPT_FILE)" | ForEach-Object {
                  if ([string]::IsNullOrWhiteSpace($_)) { return }
                  try { $evt = $_ | ConvertFrom-Json } catch { return }

                  if ($evt.type -eq 'assistant' -and $evt.message.content) {
                    foreach ($block in $evt.message.content) {
                      if ($block.type -eq 'tool_use') {
                        $toolCalls[$block.id] = [PSCustomObject]@{ Name = $block.name; Input = $block.input }
                      }
                    }
                  } elseif ($evt.type -eq 'user' -and $evt.message.content) {
                    foreach ($block in $evt.message.content) {
                      if ($block.type -eq 'tool_result' -and $block.tool_use_id -and $toolCalls.ContainsKey($block.tool_use_id)) {
                        $call = $toolCalls[$block.tool_use_id]
                        $shortName = $call.Name -replace '^mcp__flyway__', ''
                        $resultText = Get-ToolResultText $block
                        $parsedResult = $null
                        if ($resultText) { try { $parsedResult = $resultText | ConvertFrom-Json } catch {} }
                        if (-not $toolResults.ContainsKey($shortName)) { $toolResults[$shortName] = New-Object System.Collections.Generic.List[object] }
                        $toolResults[$shortName].Add([PSCustomObject]@{ Parsed = $parsedResult; Raw = $resultText; Input = $call.Input })
                      }
                    }
                  }
                }

                $toolsCalledSummary = (($toolCalls.Values | ForEach-Object { $_.Name -replace '^mcp__flyway__', '' } | Select-Object -Unique) -join ', ')
                if (-not $toolsCalledSummary) { $toolsCalledSummary = "(none)" }
                Write-Host "Tools called this run: $toolsCalledSummary"

                # --- Diff results are the actual source of truth for "did anything change" ---
                $diffResults = New-Object System.Collections.Generic.List[object]
                foreach ($key in @('create_diff_schema_model', 'create_diff_migrations')) {
                  if ($toolResults.ContainsKey($key)) { foreach ($r in $toolResults[$key]) { $diffResults.Add($r) } }
                }

                if ($diffResults.Count -eq 0) {
                  Write-Host "##vso[task.logissue type=error]No diff tool (create_diff_schema_model/create_diff_migrations) was ever called - the agent didn't actually check the database, so there is nothing trustworthy to report. Tools called this run: $toolsCalledSummary"
                  exit 1
                }

                # The capture step diffs the DB against the schema model, then the generate step
                # diffs the schema model against the migration history - after capture, both
                # legitimately report the SAME pending change, so dedupe before using this list.
                $rawDifferences = New-Object System.Collections.Generic.List[object]
                $seenDiffKeys = New-Object System.Collections.Generic.HashSet[string]
                foreach ($d in $diffResults) {
                  if ($d.Parsed.differences) {
                    foreach ($diff in $d.Parsed.differences) {
                      $diffKey = if ($diff.id) { $diff.id } else { "$($diff.name)|$($diff.type)|$($diff.change)" }
                      if ($seenDiffKeys.Add($diffKey)) { $rawDifferences.Add($diff) }
                    }
                  }
                }

                # get_diff_details gives column-level detail for a specific change, matched back by
                # the "id" the diff tool assigned it (the same id the agent passed as "changeId").
                $detailsByChangeId = @{}
                if ($toolResults.ContainsKey('get_diff_details')) {
                  foreach ($r in $toolResults['get_diff_details']) {
                    $changeId = $r.Input.changeId
                    if ($changeId -and $r.Parsed.text) { $detailsByChangeId[$changeId] = $r.Parsed.text }
                  }
                }

                function Get-ChangeDetailLine($diff) {
                  if (-not $diff.id -or -not $detailsByChangeId.ContainsKey($diff.id)) { return $null }
                  $diffText = $detailsByChangeId[$diff.id]
                  $collapsed = (($diffText -split "`r?`n") | Where-Object { $_ -match '^[+-]' -and $_ -notmatch '^[+-]{3}' }) -join '; '
                  if ($collapsed.Length -gt 300) { $collapsed = $collapsed.Substring(0, 300) + "..." }
                  return $collapsed
                }

                $destructiveDiffTypes = @('Drop')
                $changesList = New-Object System.Collections.Generic.List[string]
                $destructiveChanges = New-Object System.Collections.Generic.List[string]
                foreach ($diff in $rawDifferences) {
                  $detail = Get-ChangeDetailLine $diff
                  $line = "$($diff.change) $($diff.name) ($($diff.type))"
                  if ($detail) { $line += " - $detail" }
                  $changesList.Add($line)
                  if ($destructiveDiffTypes -contains $diff.change) {
                    $dLine = "$($diff.name) ($($diff.type))"
                    if ($detail) { $dLine += " - $detail" }
                    $destructiveChanges.Add($dLine)
                  }
                }
                $hasDestructiveChanges = $destructiveChanges.Count -gt 0

                # --- Migration file, straight from generate_migrations' own return value ---
                $migrationFile = $null
                if ($toolResults.ContainsKey('generate_migrations')) {
                  $genResult = $toolResults['generate_migrations'] | Select-Object -Last 1
                  if ($genResult.Parsed.files -and $genResult.Parsed.files.Count -gt 0) {
                    $migrationFile = "migrations/$($genResult.Parsed.files[0])"
                  }
                }

                # --- Code review, straight from review_code's own return value ---
                function Format-CodeReviewIssue($item) {
                  if ($null -eq $item) { return $null }
                  if ($item -is [string]) { return $item }
                  $parts = @()
                  if ($item.severity) { $parts += "[$($item.severity)]" }
                  $ruleId = if ($item.rule) { $item.rule } elseif ($item.code) { $item.code } else { $null }
                  if ($ruleId) { $parts += $ruleId }
                  $msg = if ($item.message) { $item.message } elseif ($item.title) { $item.title } elseif ($item.description) { $item.description } else { $null }
                  if ($msg) { $parts += $msg }
                  if ($item.line) { $parts += "line $($item.line)" }
                  if ($parts.Count -eq 0) { $parts += ($item | ConvertTo-Json -Compress -Depth 3) }
                  return ($parts -join ": ")
                }

                $rulesChecked = $null
                $issuesList = New-Object System.Collections.Generic.List[string]
                $reviewRan = $toolResults.ContainsKey('review_code')
                if ($reviewRan) {
                  $reviewResult = $toolResults['review_code'] | Select-Object -Last 1
                  $rulesChecked = $reviewResult.Parsed.total_rules_checked
                  if ($reviewResult.Parsed.issues) {
                    foreach ($i in $reviewResult.Parsed.issues) { $f = Format-CodeReviewIssue $i; if ($f) { $issuesList.Add($f) } }
                  }
                }

                # --- Status, derived from what actually happened - never from anything Claude said ---
                if ($rawDifferences.Count -eq 0) {
                  $status = "no_changes"
                } elseif ($migrationFile -and $reviewRan) {
                  $status = if ($issuesList.Count -gt 0) { "issues_found" } else { "clean" }
                } else {
                  Write-Host "##vso[task.logissue type=error]The diff found $($rawDifferences.Count) change(s), but the workflow didn't reach a completed migration + code review (migrationFile present: $([bool]$migrationFile), review ran: $reviewRan). This usually means the agent stopped partway - e.g. to ask a question - instead of finishing. Tools called this run: $toolsCalledSummary"
                  exit 1
                }

                # --- Cross-check against git - the working copy is the final ground truth ---
                $gitChangedFiles = git status --porcelain -- "$(PROJECT_FOLDER)\schema-model" "$(PROJECT_FOLDER)\migrations" 2>$null
                if ($status -eq "no_changes" -and $gitChangedFiles) {
                  Write-Host "##vso[task.logissue type=warning]The transcript showed no diff, but git shows changed files under schema-model/ or migrations/ - worth a second look:"
                  $gitChangedFiles | ForEach-Object { Write-Host "  $_" }
                } elseif ($status -ne "no_changes" -and -not $gitChangedFiles) {
                  Write-Host "##vso[task.logissue type=warning]The transcript indicated a completed migration, but git shows no changed files under schema-model/ or migrations/ - the working copy and the transcript disagree, worth investigating."
                }

                # --- description, from the migration filename convention (same as previous version) ---
                $description = $null
                if ($migrationFile) {
                  $fileLeaf = Split-Path $migrationFile -Leaf
                  if ($fileLeaf -match '^V?[\d.]+__(.+)\.sql$') { $description = $Matches[1] }
                }
                if (-not $description -and $rawDifferences.Count -gt 0) {
                  $description = "Update $(($rawDifferences | ForEach-Object { $_.name }) -join ', ')"
                }
                if (-not $description) { $description = "Schema migration" }

                $reviewSummary = if ($rawDifferences.Count -gt 0) {
                  "Touches: $(($rawDifferences | ForEach-Object { $_.name }) -join ', ') - $rulesChecked rules checked - $($issuesList.Count) issue(s)/warning(s) found."
                } else {
                  "No schema changes were found in the development database."
                }

                $changesBullets = if ($changesList.Count -gt 0) { ($changesList | ForEach-Object { "- $_" }) -join "`n" } else { "- (none)" }
                $issuesBullets = if ($issuesList.Count -gt 0) { ($issuesList | ForEach-Object { "- $_" }) -join "`n" } else { "- No issues or warnings found." }
                $destructiveBullets = if ($hasDestructiveChanges) { ($destructiveChanges | ForEach-Object { "- $_" }) -join "`n" } else { "" }

                $quickSummary = if ($hasDestructiveChanges -and $issuesList.Count -gt 0) {
                  "NEEDS CAREFUL REVIEW - includes a destructive change (drop) AND $($issuesList.Count) code review issue(s)."
                } elseif ($hasDestructiveChanges) {
                  "NEEDS REVIEW - includes a destructive change (drop). Confirm this is intentional before merging."
                } elseif ($issuesList.Count -gt 0) {
                  "NEEDS REVIEW - $($issuesList.Count) code review issue(s) flagged, no destructive changes."
                } else {
                  "LOW RISK - no destructive changes, code review clean."
                }

                # Azure DevOps logging commands are parsed one line at a time, so a variable value
                # containing raw newlines/% would corrupt the command - encode before setting,
                # ADO decodes automatically when the variable is substituted back in later steps.
                function ConvertTo-VsoSafe($text) {
                  if ($null -eq $text) { return "" }
                  return $text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                }

                # --- Run stats, from the CLI's own final result envelope - unrelated to any of the
                # facts above, so a missing/broken stats file never affects the migration result. ---
                $durationSeconds = 0; $apiDurationSeconds = 0; $numTurns = 0; $totalCostUsd = 0
                $inputTokens = 0; $outputTokens = 0; $cacheReadTokens = 0; $cacheWriteTokens = 0
                $modelSummary = ""
                if (Test-Path "$(CLAUDE_RAW_OUTPUT_FILE)") {
                  try {
                    $outer = Get-Content "$(CLAUDE_RAW_OUTPUT_FILE)" -Raw | ConvertFrom-Json
                    $durationSeconds = [math]::Round($outer.duration_ms / 1000, 1)
                    $apiDurationSeconds = [math]::Round($outer.duration_api_ms / 1000, 1)
                    $numTurns = $outer.num_turns
                    $totalCostUsd = [math]::Round([double]$outer.total_cost_usd, 4)
                    $inputTokens = $outer.usage.input_tokens
                    $outputTokens = $outer.usage.output_tokens
                    $cacheReadTokens = $outer.usage.cache_read_input_tokens
                    $cacheWriteTokens = $outer.usage.cache_creation_input_tokens
                    $modelLines = @()
                    if ($outer.modelUsage) {
                      foreach ($modelName in $outer.modelUsage.PSObject.Properties.Name) {
                        $m = $outer.modelUsage.$modelName
                        $modelCost = [math]::Round([double]$m.costUSD, 4)
                        $modelLines += "$modelName - $($m.outputTokens) output tokens, `$$modelCost"
                      }
                    }
                    $modelSummary = $modelLines -join " | "
                  } catch {
                    Write-Host "##vso[task.logissue type=warning]Could not parse run stats from $(CLAUDE_RAW_OUTPUT_FILE) - stats will show as zero in the report. This doesn't affect the migration result itself, which comes from the transcript, not this file."
                  }
                }

                Write-Host "Status: $status"
                Write-Host "Migration file: $migrationFile"
                Write-Host "Review summary: $reviewSummary"

                Write-Host "##vso[task.setvariable variable=MIGRATION_STATUS;isOutput=true]$status"
                Write-Host "##vso[task.setvariable variable=MIGRATION_FILE;isOutput=true]$migrationFile"
                Write-Host "##vso[task.setvariable variable=MIGRATION_DESCRIPTION;isOutput=true]$description"
                Write-Host "##vso[task.setvariable variable=REVIEW_SUMMARY;isOutput=true]$reviewSummary"

                $objectsTouched = ($rawDifferences | ForEach-Object { $_.name }) -join ', '
                Write-Host "##vso[task.setvariable variable=AI_OBJECTS_TOUCHED;isOutput=true]$objectsTouched"
                Write-Host "##vso[task.setvariable variable=AI_CHANGES_SUMMARY;isOutput=true]$($changesList -join '; ')"
                Write-Host "##vso[task.setvariable variable=AI_DURATION_SECONDS;isOutput=true]$durationSeconds"
                Write-Host "##vso[task.setvariable variable=AI_NUM_TURNS;isOutput=true]$numTurns"
                Write-Host "##vso[task.setvariable variable=AI_TOTAL_COST_USD;isOutput=true]$totalCostUsd"
                Write-Host "##vso[task.setvariable variable=AI_MODEL_SUMMARY;isOutput=true]$modelSummary"
                Write-Host "##vso[task.setvariable variable=AI_QUICK_SUMMARY;isOutput=true]$quickSummary"
                Write-Host "##vso[task.setvariable variable=AI_HAS_DESTRUCTIVE;isOutput=true]$hasDestructiveChanges"
                Write-Host "##vso[task.setvariable variable=AI_DESTRUCTIVE_BULLETS;isOutput=true]$(ConvertTo-VsoSafe $destructiveBullets)"
                Write-Host "##vso[task.setvariable variable=AI_CHANGES_BULLETS;isOutput=true]$(ConvertTo-VsoSafe $changesBullets)"
                Write-Host "##vso[task.setvariable variable=AI_ISSUES_BULLETS;isOutput=true]$(ConvertTo-VsoSafe $issuesBullets)"
                Write-Host "##vso[task.setvariable variable=AI_RULES_CHECKED;isOutput=true]$rulesChecked"
                Write-Host "##vso[task.setvariable variable=MIGRATION_STATUS]$status" # also set as a plain (non-output) variable so later steps IN THIS JOB can use it in a condition

                if ($status -eq "issues_found") {
                  Write-Host "##vso[task.logissue type=warning]Code review flagged issues - a human approval gate will run before any branch/PR is created. See the AI-Migration-Report artifact for full details."
                }

                # --- Write hard facts out as plain text too, for the viability-assessment step
                # that follows - same job, so a plain file hand-off is enough, and it keeps the
                # (potentially large/messy) generated SQL content out of pipeline variables. ---
                $factsLines = New-Object System.Collections.Generic.List[string]
                $factsLines.Add("Status: $status")
                $factsLines.Add("Destructive change(s) present: $hasDestructiveChanges")
                $factsLines.Add("")
                $factsLines.Add("Changes:")
                if ($changesList.Count -gt 0) { foreach ($c in $changesList) { $factsLines.Add("- $c") } } else { $factsLines.Add("(none)") }
                $factsLines.Add("")
                $factsLines.Add("Code review: $rulesChecked rules checked, $($issuesList.Count) issue(s) found")
                if ($issuesList.Count -gt 0) { foreach ($i in $issuesList) { $factsLines.Add("- $i") } }
                if ($migrationFile) {
                  $migrationFilePath = Join-Path "$(PROJECT_FOLDER)" ($migrationFile -replace '/', '\')
                  if (Test-Path $migrationFilePath) {
                    $factsLines.Add("")
                    $factsLines.Add("Generated migration SQL ($migrationFile):")
                    $factsLines.Add((Get-Content $migrationFilePath -Raw))
                  }
                }
                $factsLines -join "`n" | Set-Content -Path "$(MIGRATION_FACTS_FILE)" -Encoding utf8

                # --- Human-readable summary, for anyone reading the pipeline log rather than the raw JSON ---
                Write-Host ""
                Write-Host "================================================================"
                Write-Host " AI MIGRATION SUMMARY (verified by Flyway - see next step for AI viability assessment)"
                Write-Host "================================================================"
                $statusLabel = switch ($status) {
                  "clean"        { "CLEAN - a PR will be raised for review" }
                  "issues_found" { "ISSUES FOUND - human approval required before a PR is raised" }
                  "no_changes"   { "NO CHANGES - nothing to do" }
                  default        { $status }
                }
                Write-Host " Quick summary: $quickSummary"
                Write-Host " Status:        $statusLabel"
                if ($description)   { Write-Host " Change:        $description" }
                if ($migrationFile) { Write-Host " File:          $migrationFile" }
                if ($null -ne $rulesChecked) { Write-Host " Rules checked: $rulesChecked" }
                if ($hasDestructiveChanges) {
                  Write-Host " DESTRUCTIVE CHANGE(S):"
                  foreach ($d in $destructiveChanges) { Write-Host "   - $d" }
                }
                if ($changesList.Count -gt 0) {
                  Write-Host " Changes:"
                  foreach ($c in $changesList) { Write-Host "   - $c" }
                }
                if ($issuesList.Count -gt 0) {
                  Write-Host " Issues / warnings:"
                  foreach ($issue in $issuesList) { Write-Host "   - $issue" }
                }
                Write-Host ""
                Write-Host " Review notes:"
                Write-Host " $reviewSummary"
                Write-Host "----------------------------------------------------------------"
                Write-Host " AI RUN STATS"
                Write-Host "----------------------------------------------------------------"
                Write-Host " Duration:      ${durationSeconds}s total (${apiDurationSeconds}s model API time)"
                Write-Host " Turns:         $numTurns"
                Write-Host " Total cost:    `$$totalCostUsd"
                Write-Host " Tokens:        $inputTokens in / $outputTokens out ($cacheReadTokens cache read, $cacheWriteTokens cache write)"
                if ($modelSummary) { Write-Host " Models used:   $modelSummary" }
                Write-Host "================================================================"
                Write-Host ""

                # --- Write the same information out as a Markdown report, for anyone reviewing this
                # from the Artifacts tab rather than digging through the pipeline log. The next step
                # (viability assessment) inserts its own section into this same file afterward. ---
                $reportLines = New-Object System.Collections.Generic.List[string]
                $reportLines.Add("# AI Migration Report")
                $reportLines.Add("")
                $reportLines.Add("## Quick summary")
                $reportLines.Add($quickSummary)
                $reportLines.Add("")
                if ($hasDestructiveChanges) {
                  $reportLines.Add("### :warning: Destructive change(s)")
                  foreach ($d in $destructiveChanges) { $reportLines.Add("- $d") }
                  $reportLines.Add("")
                }
                $reportLines.Add("**Status:** $statusLabel")
                if ($description)   { $reportLines.Add("**Change:** $description") }
                if ($migrationFile) { $reportLines.Add("**Migration file:** ``$migrationFile``") }
                $reportLines.Add("")
                $reportLines.Add("## Verified by Flyway (unbiased - straight from the Flyway MCP tool calls, not the AI's narration)")
                $reportLines.Add("")
                if ($changesList.Count -gt 0) {
                  $reportLines.Add("### Changes")
                  foreach ($c in $changesList) { $reportLines.Add("- $c") }
                  $reportLines.Add("")
                }
                $reportLines.Add("### Code review")
                if ($null -ne $rulesChecked) { $reportLines.Add("Rules checked: $rulesChecked") }
                if ($issuesList.Count -gt 0) {
                  $reportLines.Add("")
                  $reportLines.Add("#### :warning: Issues / warnings found")
                  foreach ($issue in $issuesList) { $reportLines.Add("- $issue") }
                } else {
                  $reportLines.Add("No issues or warnings were raised.")
                }
                $reportLines.Add("")
                $reportLines.Add("## AI run stats")
                $reportLines.Add("- Duration: ${durationSeconds}s total (${apiDurationSeconds}s model API time)")
                $reportLines.Add("- Turns: $numTurns")
                $reportLines.Add("- Total cost: `$$totalCostUsd")
                $reportLines.Add("- Tokens: $inputTokens in / $outputTokens out ($cacheReadTokens cache read, $cacheWriteTokens cache write)")
                if ($modelSummary) { $reportLines.Add("- Models used: $modelSummary") }
                if ($status -eq "issues_found") {
                  $reportLines.Add("")
                  $reportLines.Add("---")
                  $reportLines.Add("**This migration requires human approval before a PR is raised** - see the pending check on this pipeline run.")
                }

                $reportDir = "$(Build.ArtifactStagingDirectory)\AIReport"
                New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
                $reportLines -join "`n" | Set-Content -Path "$reportDir\migration-report.md" -Encoding utf8
                Write-Host "Human-readable report written to $reportDir\migration-report.md"
            name: ParseResult

          # Step 4 - A second, separate AI call: zero tools, given only the hard facts just
          # extracted, asked for a short professional opinion on whether this looks safe to deploy.
          # Skipped entirely when there's nothing to assess. This call has nothing to do except
          # write a paragraph, which is why it's far more reliable than asking the acting agent to
          # both do the work AND self-report in a previous version of this pipeline.
          - task: PowerShell@2
            displayName: "AI Agent - Assess Migration Viability"
            condition: and(succeeded(), in(variables['MIGRATION_STATUS'], 'clean', 'issues_found'))
            name: ViabilityAssessment
            inputs:
              targetType: "inline"
              workingDirectory: "$(PROJECT_FOLDER)"
              script: |
                $env:DISABLE_AUTOUPDATER = "1"

                $viabilityPromptFile = Join-Path "$(PROMPTS_FOLDER)" "assess-viability.prompt.txt"
                if (-not (Test-Path $viabilityPromptFile)) {
                  Write-Host "##vso[task.logissue type=warning]Prompt file not found at $viabilityPromptFile - skipping the viability assessment. The PR will still be raised with what's verified by Flyway alone."
                  Write-Host "##vso[task.setvariable variable=AI_VIABILITY_ASSESSMENT;isOutput=true]AI viability assessment unavailable (prompt file missing) - see what's verified by Flyway below directly."
                  exit 0
                }
                if (-not (Test-Path "$(MIGRATION_FACTS_FILE)")) {
                  Write-Host "##vso[task.logissue type=warning]Facts file not found at $(MIGRATION_FACTS_FILE) - skipping the viability assessment. The PR will still be raised with what's verified by Flyway alone."
                  Write-Host "##vso[task.setvariable variable=AI_VIABILITY_ASSESSMENT;isOutput=true]AI viability assessment unavailable (facts file missing) - see what's verified by Flyway below directly."
                  exit 0
                }

                $facts = Get-Content -Raw -Path "$(MIGRATION_FACTS_FILE)"
                $promptTemplate = Get-Content -Raw -Path $viabilityPromptFile
                # Only the replacement's literal '$' needs doubling (so it isn't read as a
                # backreference like $1/$&) - the facts text itself must NOT be regex-escaped here,
                # that would mangle punctuation in the generated SQL/details straight into the prompt.
                $viabilityPrompt = $promptTemplate -replace '\{\{FACTS\}\}', $facts.Replace('$', '$$')

                # Zero tools needed - this call only has the facts already extracted, on purpose,
                # so there's nothing for it to do except write the paragraph asked for.
                $viabilityOutputLines = & $(AI_CLI_COMMAND) -p $viabilityPrompt `
                  --disallowedTools "Bash,Read,Write,Edit,MultiEdit,NotebookEdit,Glob,Grep,Task,WebFetch,WebSearch,AskUserQuestion,Skill,mcp__flyway__load_project,mcp__flyway__create_diff_schema_model,mcp__flyway__get_diff_details,mcp__flyway__update_schema_model,mcp__flyway__create_diff_migrations,mcp__flyway__generate_migrations,mcp__flyway__review_code" `
                  --output-format json `
                  --max-turns 3
                $viabilityResultLine = $viabilityOutputLines -join "`n"

                $viabilityText = $null
                try {
                  $viabilityOuter = $viabilityResultLine | ConvertFrom-Json
                  if ($viabilityOuter.result) {
                    $viabilityText = $viabilityOuter.result.Trim() -replace '^```\s*', '' -replace '\s*```$', ''
                  }
                } catch {
                  Write-Host "##vso[task.logissue type=warning]Could not parse the viability assessment call's output. Raw output was:"
                  Write-Host $viabilityResultLine
                }

                if ([string]::IsNullOrWhiteSpace($viabilityText)) {
                  $viabilityText = "AI viability assessment unavailable for this run - review what's verified by Flyway below directly."
                  Write-Host "##vso[task.logissue type=warning]Viability assessment came back empty - using a placeholder. This is commentary, not a fact, so it doesn't block the PR."
                }

                Write-Host ""
                Write-Host "AI viability assessment:"
                Write-Host $viabilityText
                Write-Host ""

                function ConvertTo-VsoSafe($text) {
                  if ($null -eq $text) { return "" }
                  return $text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                }
                Write-Host "##vso[task.setvariable variable=AI_VIABILITY_ASSESSMENT;isOutput=true]$(ConvertTo-VsoSafe $viabilityText)"

                # Insert this as its own section into the report the previous step already wrote,
                # right after the quick summary - a reviewer should see the AI's judgment call
                # before the hard facts underneath it, not the other way round.
                $reportPath = "$(Build.ArtifactStagingDirectory)\AIReport\migration-report.md"
                if (Test-Path $reportPath) {
                  $existingLines = Get-Content $reportPath
                  $insertAt = $existingLines.Count
                  for ($i = 0; $i -lt $existingLines.Count; $i++) {
                    if ($existingLines[$i] -like "## Verified by Flyway*") { $insertAt = $i; break }
                  }
                  $viabilitySection = @("## AI viability assessment", "", $viabilityText, "")
                  $before = if ($insertAt -gt 0) { $existingLines[0..($insertAt - 1)] } else { @() }
                  $after = $existingLines[$insertAt..($existingLines.Count - 1)]
                  ($before + $viabilitySection + $after) -join "`n" | Set-Content -Path $reportPath -Encoding utf8
                  Write-Host "Viability assessment inserted into $reportPath"
                } else {
                  Write-Host "##vso[task.logissue type=warning]Report file not found at $reportPath to insert the viability assessment into - the previous step may not have run."
                }

          - task: PublishBuildArtifacts@1
            displayName: "Publish AI Migration Report"
            condition: and(succeeded(), in(variables['MIGRATION_STATUS'], 'clean', 'issues_found'))
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)\\AIReport"
              ArtifactName: "AI-Migration-Report-$(Build.BuildId)"

          # The next stage runs as a SEPARATE job, and file-system continuity between jobs on a
          # self-hosted agent is not something to rely on (workspace cleanup timing varies). Publish
          # the files Claude actually generated as a build artifact so the next stage can restore
          # them explicitly, rather than assuming they're still sitting on disk. Runs for
          # issues_found too, since the reviewer needs to see the actual diff, not just the report.
          - task: CopyFiles@2
            displayName: "Stage Generated Migration Files for Publish"
            condition: and(succeeded(), in(variables['MIGRATION_STATUS'], 'clean', 'issues_found'))
            inputs:
              SourceFolder: "$(PROJECT_FOLDER)"
              Contents: |
                schema-model/**
                migrations/**
              TargetFolder: "$(Build.ArtifactStagingDirectory)/GeneratedMigration"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Generated Migration Files"
            condition: and(succeeded(), in(variables['MIGRATION_STATUS'], 'clean', 'issues_found'))
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)/GeneratedMigration"
              ArtifactName: "GeneratedMigration-$(Build.BuildId)"

  - stage: RaisePullRequest
    displayName: "Raise PR for Human Review"
    dependsOn: GenerateMigration
    condition: in(dependencies.GenerateMigration.outputs['RunAgent.ParseResult.MIGRATION_STATUS'], 'clean', 'issues_found')
    variables:
      MIGRATION_STATUS: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.MIGRATION_STATUS'] ]
      MIGRATION_FILE: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.MIGRATION_FILE'] ]
      MIGRATION_DESCRIPTION: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.MIGRATION_DESCRIPTION'] ]
      REVIEW_SUMMARY: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.REVIEW_SUMMARY'] ]
      AI_OBJECTS_TOUCHED: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_OBJECTS_TOUCHED'] ]
      AI_CHANGES_SUMMARY: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_CHANGES_SUMMARY'] ]
      AI_DURATION_SECONDS: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_DURATION_SECONDS'] ]
      AI_NUM_TURNS: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_NUM_TURNS'] ]
      AI_TOTAL_COST_USD: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_TOTAL_COST_USD'] ]
      AI_MODEL_SUMMARY: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_MODEL_SUMMARY'] ]
      AI_QUICK_SUMMARY: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_QUICK_SUMMARY'] ]
      AI_HAS_DESTRUCTIVE: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_HAS_DESTRUCTIVE'] ]
      AI_DESTRUCTIVE_BULLETS: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_DESTRUCTIVE_BULLETS'] ]
      AI_CHANGES_BULLETS: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_CHANGES_BULLETS'] ]
      AI_ISSUES_BULLETS: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_ISSUES_BULLETS'] ]
      AI_RULES_CHECKED: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ParseResult.AI_RULES_CHECKED'] ]
      AI_VIABILITY_ASSESSMENT: $[ stageDependencies.GenerateMigration.RunAgent.outputs['ViabilityAssessment.AI_VIABILITY_ASSESSMENT'] ]
    jobs:
      # ManualValidation@0 is an "agentless" task - it can only run on the special server job
      # target, not on a normal agent pool alongside checkout/git steps. It needs its own job.
      - job: ApprovalGate
        displayName: "Approval Gate (only runs if issues were found)"
        pool: server
        condition: eq(variables['MIGRATION_STATUS'], 'issues_found')
        steps:
          - task: ManualValidation@0
            displayName: "Approval Required - Code Review Issues Found"
            timeoutInMinutes: 1440 # 1 day - adjust to fit your team's review cadence
            inputs:
              notifyUsers: "" # add reviewer emails/groups here so they're notified when this pauses
              instructions: "The AI code review flagged issues with this migration - see the AI-Migration-Report-$(Build.BuildId) artifact (from the GenerateMigration stage) for full details before deciding. Approve to raise a PR anyway for human review in Azure DevOps. Reject to stop here without creating a branch or PR."
              onTimeout: "reject"

      - job: BranchAndPR
        displayName: "Create feature branch and open PR"
        dependsOn: ApprovalGate
        # Proceed if the gate was approved, OR if it was skipped entirely (status was 'clean', so
        # no approval was ever needed). Only an explicit reject (job result 'Failed') stops this.
        condition: in(dependencies.ApprovalGate.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')
        steps:
          - checkout: self
            persistCredentials: true # Required so git can push using the pipeline's own auth

          # Restore the exact files Claude generated in the previous stage - see the note on the
          # publish step for why we don't just assume they're still on disk from the other job.
          - task: DownloadBuildArtifacts@0
            displayName: "Download Generated Migration Files"
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "GeneratedMigration-$(Build.BuildId)"
              downloadPath: "$(System.ArtifactsDirectory)"

          - task: CopyFiles@2
            displayName: "Restore Generated Migration Files into Working Copy"
            inputs:
              SourceFolder: "$(System.ArtifactsDirectory)/GeneratedMigration-$(Build.BuildId)"
              Contents: "**"
              TargetFolder: "$(PROJECT_FOLDER)"
              OverWrite: true

          - task: PowerShell@2
            displayName: "Create branch, commit generated migration, push"
            inputs:
              targetType: "inline"
              workingDirectory: "$(WORKING_DIRECTORY)"
              script: |
                # Build a readable branch name from Claude's own one-line description of the change,
                # rather than a bare timestamp/build ID - e.g. ai-migration/add-offers-table-20260817-1432
                function ConvertTo-Slug($text) {
                  if ([string]::IsNullOrWhiteSpace($text)) { return "migration" }
                  $slug = $text.ToLower() -replace '[^a-z0-9]+', '-'
                  $slug = $slug.Trim('-')
                  if ($slug.Length -gt 50) { $slug = $slug.Substring(0, 50).Trim('-') }
                  if ([string]::IsNullOrWhiteSpace($slug)) { return "migration" }
                  return $slug
                }

                $slug = ConvertTo-Slug "$(MIGRATION_DESCRIPTION)"
                $timestamp = Get-Date -Format "yyyyMMdd-HHmm"
                $branchPrefix = if ("$(MIGRATION_STATUS)" -eq "issues_found") { "$(FEATURE_BRANCH_PREFIX)/needs-review" } else { "$(FEATURE_BRANCH_PREFIX)" }
                $branchName = "$branchPrefix/$slug-$timestamp"

                git config user.email "flyway-ai-bot@$(Build.Repository.Name)"
                git config user.name "Flyway AI Agent"

                git checkout "$(DEVELOPMENT_BRANCH)"
                git pull origin "$(DEVELOPMENT_BRANCH)"
                git checkout -b $branchName

                git add "$(PROJECT_FOLDER)\schema-model" "$(PROJECT_FOLDER)\migrations"
                git status
                git commit -m "AI-generated migration: $(MIGRATION_DESCRIPTION)"
                git push origin $branchName

                Write-Host "##vso[task.setvariable variable=FEATURE_BRANCH_NAME]$branchName"
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          # Uses the Azure DevOps REST API directly so this works the same on any ADO
          # flavor (Services or on-prem Server) without an extra CLI dependency.
          - task: PowerShell@2
            displayName: "Open pull request into development"
            inputs:
              targetType: "inline"
              script: |
                $titlePrefix = if ("$(MIGRATION_STATUS)" -eq "issues_found") { "[Approved despite review issues] " } else { "" }
                $titleSuffix = if ("$(AI_OBJECTS_TOUCHED)") { " ($(AI_OBJECTS_TOUCHED))" } else { "" }
                if ("$(AI_HAS_DESTRUCTIVE)" -eq "True") { $titlePrefix = "[Contains destructive change] $titlePrefix" }

                # Destructive changes (drops) get their own banner right after the quick summary -
                # a reviewer scanning PR titles/descriptions in a list should see this before
                # anything else, not after digging into a bulleted changes section further down.
                $destructiveBanner = if ("$(AI_HAS_DESTRUCTIVE)" -eq "True") {
                  "`n`n**:warning: Contains a destructive change (drop):**`n$(AI_DESTRUCTIVE_BULLETS)"
                } else { "" }
                $exceptionNote = if ("$(MIGRATION_STATUS)" -eq "issues_found") { "`n`n---`n**:warning: This migration was approved despite code review issues being flagged** - see the issues listed above before merging." } else { "" }

                # Deliberately two sections, in this order: the AI's judgment call first (clearly
                # labeled as an opinion, not a fact), then the hard facts underneath it - extracted
                # directly from the Flyway MCP tool calls, not from anything the AI said about them -
                # so a reviewer can verify the facts independently of whether they trust the opinion.
                $body = @{
                  sourceRefName = "refs/heads/$(FEATURE_BRANCH_NAME)"
                  targetRefName = "refs/heads/$(DEVELOPMENT_BRANCH)"
                  title = "$($titlePrefix)AI-generated migration: $(MIGRATION_DESCRIPTION)$titleSuffix"
                  description = "**Quick summary:** $(AI_QUICK_SUMMARY)$destructiveBanner`n`n---`n**AI viability assessment** (professional opinion, not a fact - weigh it, don't just trust it):`n`n$(AI_VIABILITY_ASSESSMENT)`n`n---`n**Verified by Flyway** (unbiased - straight from the Flyway MCP tool calls, not from the AI's own narration):`n`n**Objects added/changed/dropped:**`n$(AI_CHANGES_BULLETS)`n`n**Code review ($(AI_RULES_CHECKED) rules checked):**`n$(AI_ISSUES_BULLETS)`n`n**Generated file:** $(MIGRATION_FILE)`n`n---`n**AI run stats:** $(AI_NUM_TURNS) turns, $(AI_DURATION_SECONDS)s, `$$(AI_TOTAL_COST_USD)`n$(AI_MODEL_SUMMARY)$exceptionNote`n`n---`nPlease review before merging - this PR was not merged automatically."
                } | ConvertTo-Json

                $uri = "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.Name)/pullrequests?api-version=6.1-preview.1"
                $headers = @{ Authorization = "Bearer $(System.AccessToken)" }

                Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body $body -ContentType "application/json"
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

# ===========================
# ONE-TIME SETUP (required before this pipeline will run)
#
# 1. Repo permissions: grant the Build Service account "Contribute", "Create branch", and
#    "Contribute to pull requests" on this repo (Project Settings > Repositories > Security).
# 2. Enable "Allow scripts to access the OAuth token" on this pipeline's Agent Job settings -
#    required for the git push and PR steps to use System.AccessToken.
# 3. On the agent machine, under the account the agent service runs as: run `claude` once
#    interactively in this project folder and accept the "New MCP server found in .mcp.json:
#    flyway" trust prompt ("Use this and all future MCP servers in this project"). That decision
#    is stored on disk and is what every unattended run relies on - skipping this is the most
#    common cause of the AI agent step failing immediately with no useful output.
# 4. Confirm Flyway is authenticated on the agent (or set FLYWAY_AUTH_DISABLED=true), and that
#    your AI CLI of choice is installed and licensed there too.
#
# KNOWN LIMITATIONS (V2 - worth addressing before wider customer distribution)
#
# - --allowedTools and --disallowedTools are both required together (the former is additive, not
#   restrictive, on its own) - never add --dangerously-skip-permissions or a --permission-mode
#   bypass to either AI agent step, both are confirmed to silently override --disallowedTools.
# - notifyUsers on the approval gate is empty - add reviewer emails/groups before relying on it.
# - Swap "claude" and its flags for your standardized AI tool's headless-mode equivalent if not
#   using Claude Code - the MCP server and .mcp.json itself don't change. The transcript-parsing
#   step assumes Claude Code's stream-json event shape specifically, though - a different CLI's
#   equivalent verbose/streamed output would need its own parsing logic there.
# - No retry/timeout handling around either AI agent step, and no hard cost cap beyond --max-turns.
# - The "AI viability assessment" step is a genuine opinion, not a verified fact - it's explicitly
#   labeled as such in the PR body, deliberately separate from the hard facts section beneath it.
#   If that step fails or comes back empty, the pipeline still proceeds with a placeholder message
#   and the hard facts alone - a missing opinion is not a reason to block a PR built on real facts.
# ===========================
